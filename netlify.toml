[build]
  command = "npm run build"
  publish = "dist"

# Security headers. Deliberately scoped to the directives that add real
# protection without risking the third parties the site depends on (AdSense,
# Netlify Identity, YouTube embeds) or the inline scripts Astro emits.
#
# The CSP here is the zero-breakage subset: it hardens framing, plugin content
# and <base> injection, but sets no script-src/style-src, so nothing that
# currently loads can be blocked. Tightening to a full script-src needs the
# AdSense/Identity origins allowlisted and hashes for every inline script,
# which is a separate, test-it-properly change.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "frame-ancestors 'self'; object-src 'none'; base-uri 'self'"

[functions]
  directory = "netlify/functions"

# /itgc-series was removed; keep the URL alive for anything already linking to it.
[[redirects]]
  from = "/itgc-series"
  to = "/blog"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
